<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>BioHacker</title>
  <script type="text/javascript">
    // Handle GitHub Pages SPA routing
    (function() {
      // Redirect if needed
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect != location.href) {
        history.replaceState(null, null, redirect);
      }
      
      // Check for parameters indicating a route
      var l = window.location;
      var search = l.search;
      if (search && search.indexOf('?p=/') === 0) {
        var path = search.substr(3);
        var queryIndex = path.indexOf('&q=');
        var hashIndex = path.indexOf('#');
        
        // Extract query and hash if present
        var query = '';
        var hash = '';
        
        if (queryIndex !== -1) {
          query = path.substr(queryIndex + 3);
          path = path.substr(0, queryIndex);
        }
        
        if (hashIndex !== -1) {
          hash = path.substr(hashIndex + 1);
          path = path.substr(0, hashIndex);
        }
        
        // Clean URL and navigate
        var cleanUrl = l.pathname + (query ? '?' + query : '') + (hash ? '#' + hash : '');
        window.history.replaceState(null, null, cleanUrl);
        
        // Set initial hash path for routing
        window.location.hash = '#' + path;
      }
    })();
  </script>
  <script>
    // Redirect script for GitHub Pages compatibility
    // Use hash-based routing for all paths
    document.addEventListener('DOMContentLoaded', function() {
      var path = window.location.pathname;
      var ghPagesRepo = '/test2'; // Your GitHub Pages repository name
      
      // Handle GitHub Pages repository path
      if (path.indexOf(ghPagesRepo) === 0) {
        // Strip the repo name from the path
        path = path.substr(ghPagesRepo.length) || '/';
        
        // Set hash for router (if not already set)
        if (window.location.hash === '' && path !== '/') {
          window.location.hash = '#' + path;
        }
      }
    });
  </script>
</head>
<body>
  <h2>This is a redirect page for GitHub Pages - you should not see this content</h2>
  <p>If you're seeing this, you might need to enable JavaScript or there could be an issue with the redirect scripts.</p>
  <script>
    window.location.href = '/test2/';
  </script>
</body>
</html>
